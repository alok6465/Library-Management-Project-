<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Viewer - Excel & CSV Reader</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .upload-area {
            border: 2px dashed #007bff;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            background: #f8f9fa;
            transition: all 0.3s ease;
            cursor: pointer;
            user-select: none;
        }
        .upload-area:hover {
            border-color: #0056b3;
            background: #e3f2fd;
            transform: translateY(-2px);
        }
        .table-container {
            max-height: 500px;
            overflow-y: auto;
        }
        .search-highlight {
            background-color: yellow !important;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h1 class="text-center mb-4">
                    <i class="bi bi-file-earmark-spreadsheet"></i>
                    File Viewer
                </h1>
                
                <!-- Upload Section -->
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="upload-area" id="uploadArea">
                            <i class="bi bi-cloud-upload fs-1 text-primary"></i>
                            <h4>Upload Excel (.xlsx) or CSV (.csv) File</h4>
                            <p class="text-muted">Drag and drop or click to select</p>
                            <input type="file" id="fileInput" accept=".xlsx,.csv" style="display: none;">
                            <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
                                <i class="bi bi-upload"></i> Choose File
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Controls Section -->
                <div class="card mb-4" id="controlsSection" style="display: none;">
                    <div class="card-body">
                        <div class="row align-items-center">
                            <div class="col-md-6">
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-search"></i>
                                    </span>
                                    <input type="text" class="form-control" id="searchInput" placeholder="Search in data...">
                                </div>
                            </div>
                            <div class="col-md-6 text-end">
                                <button class="btn btn-success" id="downloadHtmlBtn">
                                    <i class="bi bi-file-code"></i> Download HTML
                                </button>
                                <button class="btn btn-primary ms-2" id="downloadDocBtn">
                                    <i class="bi bi-file-word"></i> Download DOC
                                </button>
                                <button class="btn btn-secondary ms-2" onclick="location.reload()">
                                    <i class="bi bi-arrow-clockwise"></i> Reset
                                </button>
                            </div>
                        </div>
                        <div class="mt-2">
                            <small class="text-muted" id="fileInfo"></small>
                        </div>
                    </div>
                </div>

                <!-- Data Table Section -->
                <div class="card" id="tableSection" style="display: none;">
                    <div class="card-body">
                        <div class="table-container" id="tableContainer">
                            <!-- Table will be loaded here -->
                        </div>
                    </div>
                </div>

                <!-- Loading Spinner -->
                <div class="text-center" id="loadingSpinner" style="display: none;">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2">Processing file...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentFilename = '';
        let originalTableHtml = '';

        // File input handling
        document.getElementById('fileInput').addEventListener('change', handleFileUpload);
        
        // Drag and drop
        const uploadArea = document.getElementById('uploadArea');
        
        uploadArea.addEventListener('click', () => {
            document.getElementById('fileInput').click();
        });
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.stopPropagation();
            uploadArea.style.borderColor = '#0056b3';
            uploadArea.style.background = '#e3f2fd';
        });
        
        uploadArea.addEventListener('dragleave', (e) => {
            e.preventDefault();
            e.stopPropagation();
            uploadArea.style.borderColor = '#007bff';
            uploadArea.style.background = '#f8f9fa';
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            e.stopPropagation();
            uploadArea.style.borderColor = '#007bff';
            uploadArea.style.background = '#f8f9fa';
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                const fileInput = document.getElementById('fileInput');
                fileInput.files = files;
                handleFileUpload();
            }
        });

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', function() {
            const searchTerm = this.value.toLowerCase();
            const table = document.getElementById('dataTable');
            
            if (!table) return;
            
            const rows = table.getElementsByTagName('tr');
            
            for (let i = 1; i < rows.length; i++) {
                const row = rows[i];
                const cells = row.getElementsByTagName('td');
                let found = false;
                
                for (let j = 0; j < cells.length; j++) {
                    const cellText = cells[j].textContent.toLowerCase();
                    if (cellText.includes(searchTerm)) {
                        found = true;
                        break;
                    }
                }
                
                row.style.display = found ? '' : 'none';
            }
        });

        // HTML download
        document.getElementById('downloadHtmlBtn').addEventListener('click', function() {
            if (!currentFilename) return;
            
            const searchTerm = document.getElementById('searchInput').value;
            
            fetch('/download_html', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    filename: currentFilename,
                    search: searchTerm
                })
            })
            .then(response => {
                if (response.ok) {
                    return response.blob();
                }
                throw new Error('HTML generation failed');
            })
            .then(blob => {
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${currentFilename.split('.')[0]}_data.html`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
            })
            .catch(error => {
                alert('Error generating HTML: ' + error.message);
            });
        });

        // DOC download
        document.getElementById('downloadDocBtn').addEventListener('click', function() {
            if (!currentFilename) return;
            
            const searchTerm = document.getElementById('searchInput').value;
            
            fetch('/download_doc', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    filename: currentFilename,
                    search: searchTerm
                })
            })
            .then(response => {
                if (response.ok) {
                    return response.blob();
                }
                throw new Error('DOC generation failed');
            })
            .then(blob => {
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${currentFilename.split('.')[0]}_data.doc`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
            })
            .catch(error => {
                alert('Error generating DOC: ' + error.message);
            });
        });

        function handleFileUpload() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            
            if (!file) return;
            
            const formData = new FormData();
            formData.append('file', file);
            
            // Show loading
            document.getElementById('loadingSpinner').style.display = 'block';
            document.getElementById('controlsSection').style.display = 'none';
            document.getElementById('tableSection').style.display = 'none';
            
            fetch('/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('loadingSpinner').style.display = 'none';
                
                if (data.success) {
                    currentFilename = data.filename;
                    originalTableHtml = data.table;
                    
                    document.getElementById('tableContainer').innerHTML = data.table;
                    document.getElementById('fileInfo').textContent = 
                        `File: ${data.filename} | Rows: ${data.rows} | Columns: ${data.columns}`;
                    
                    document.getElementById('controlsSection').style.display = 'block';
                    document.getElementById('tableSection').style.display = 'block';
                } else {
                    alert('Error: ' + data.error);
                }
            })
            .catch(error => {
                document.getElementById('loadingSpinner').style.display = 'none';
                alert('Error uploading file: ' + error.message);
            });
        }
    </script>
</body>
</html>
